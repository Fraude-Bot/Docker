name: fraudebot

x-host-user: &host_user "${FRAUDEBOT_UID:-0}:${FRAUDEBOT_GID:-0}"

services:
  backend:
    build:
      context: .
      dockerfile: php/Dockerfile
    image: laravel-clean-app
    working_dir: /var/www/backend
    user: *host_user
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    volumes:
      - ${FRAUDEBOT_BACKEND_DIR:-../backend/main}:/var/www/backend
      - ./php/conf.d/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
      - ./php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    depends_on:
      - db
      - cache
    env_file:
      - ./php/.env.php

  web:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ${FRAUDEBOT_BACKEND_DIR:-../backend/main}:/var/www/backend:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      VITE_API_BASE_URL: http://localhost:9000/api
    volumes:
      - ${FRAUDEBOT_FRONTEND_DIR:-../frontend}:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - 80:80
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev; else tail -f /dev/null; fi"

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ./db/.env.db
    ports:
      - 3306:3306
    volumes:
      - fraudebot-db-data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf:ro

  cache:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - fraudebot-cache-data:/data

volumes:
  fraudebot-db-data:
  fraudebot-cache-data:
  frontend-node-modules:
    name: fraudebot-frontend-node-modules-${FRAUDEBOT_FRONTEND_SLUG:-main}
